[general]
import = [
    "~/.config/alacritty/themes/noctalia.toml",
]

live_config_reload = true

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[font]
normal = { family = "FiraCode Nerd Font"  }
# normal = { family = "Departure Mono Nerd Font"  }
size = 11.0

[cursor]
style = {
  shape = "Beam",
  blinking = "On"
}

[window]
decorations = "None"
dynamic_padding = true
padding = {
  x = 16,
  y = 12
}
dimensions = {
  columns = 120,
  lines = 35
}
opacity = 0.80

[keyboard]
bindings = [
{ key = "Insert", mods = "Shift", action = "Paste" },
{ key = "Insert", mods = "Control", action = "Copy" },
{ key = "Return", mods = "Shift", chars = "\u001B\r" }
]
