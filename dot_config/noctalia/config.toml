[audio]
enable_overdrive = true
enable_sounds = true
sound_volume = 0.14999999664723873

[bar.default]
background_opacity = 0.5
capsule = true
capsule_padding = 5.0
capsule_radius = 6
center = [ "audio_visualizer", "clock", "weather" ]
end = [ "tray", "keyboard_layout", "notifications", "group:g1", "session" ]
margin_ends = 0
padding = 8
position = "left"
radius_bottom_left = 0
radius_top_left = 0
start = [ "launcher", "workspaces" ]
widget_spacing = 4

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "volume", "battery" ]
    opacity = 1.0
    padding = 5.0
    radius = 6.0

[brightness]
minimum_brightness = 0.01

[control_center]
sidebar_section = "none"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Valozhyn, Belarus"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 800.0
    cy = 818.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
force = true

[notification]
offset_x = 0
offset_y = 0
show_actions = true

[osd.kinds]
media = false

[shell]
password_style = "random"
polkit_agent = true

    [shell.animation]
    speed = 4.0

    [shell.launcher]
    categories = false

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_wallpaper = true
    session_placement = "floating"
    session_position = "center"

    [shell.screen_corners]
    enabled = true
    size = 16

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "command"
    command = "killall noctalia; sleep 2; noctalia -d"
    countdown_seconds = 0.0
    enabled = true
    glyph = "noctalia"
    label = "Restart noctalia"
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "6"
    variant = "destructive"

[theme]
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "qt", "starship" ]
    community_ids = [ "discord", "telegram", "steam", "fastfetch", "zathura", "bat" ]

[wallpaper]
directory = "/home/ah3ron/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/ah3ron/Pictures/Wallpapers/wallhaven-lyj79r.png"

    [wallpaper.last]
    path = "/home/ah3ron/Pictures/Wallpapers/wallhaven-lyj79r.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/ah3ron/Pictures/Wallpapers/wallhaven-lyj79r.png"

[widget.audio_visualizer]
bands = 4
width = 32

[widget.battery]
show_label = false

[widget.keyboard_layout]
show_glyph = false

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.weather]
scale = 0.85
